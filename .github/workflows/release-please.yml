name: release-please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    uses: Qeteshpony/reusable-workflows/.github/workflows/release-please.yml@main
    with:
      config-file: release.kibot.yml
      board-file: pcb/displaytronic.kicad_pcb

  upload-firmware:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -d firmware

      - name: Upload firmware to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cp firmware/.pio/build/ATmega328P/firmware.hex "flipdot-firmware-${TAG}.hex"
          gh release upload "$TAG" "flipdot-firmware-${TAG}.hex" --repo "${{ github.repository }}"